<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="body">

  <nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
      <button class="btn btn-outline-light btn-sm" id="dark-mode-toggle">Dark Mode</button>
    </div>
  </nav>

  <div class="container py-4">

    <div class="summary-grid mb-4">
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <p class="text-muted mb-1">Total</p>
          <h3 id="total-amount">0.00</h3>
        </div>
      </div>
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <p class="text-muted mb-1">Number of expenses</p>
          <h3 id="total-count">0</h3>
        </div>
      </div>
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <p class="text-muted mb-1">Highest expense</p>
          <h3 id="highest-amount">0.00</h3>
          <small class="text-muted" id="highest-title"></small>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add expense</h5>
        <form id="expense-form">
          <div class="row">
            <div class="col-md-3 mb-2">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" id="title">
              <small class="text-danger" id="title-error"></small>
            </div>
            <div class="col-md-3 mb-2">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" class="form-control" id="amount">
              <small class="text-danger" id="amount-error"></small>
            </div>
            <div class="col-md-3 mb-2">
              <label class="form-label">Category</label>
              <select class="form-select" id="category">
                <option value="">Choose...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <small class="text-danger" id="category-error"></small>
            </div>
            <div class="col-md-3 mb-2">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" id="date">
            </div>
          </div>
          <button type="submit" class="btn btn-primary mt-2">Add expense</button>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Expenses</h5>
          <div>
            <label class="me-2">Category</label>
            <select class="form-select d-inline-block" id="filter-category" style="width: auto;">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="loading" class="text-center py-4 d-none">
          <div class="spinner-border text-primary" role="status"></div>
        </div>

        <div id="alert-box"></div>

        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-table"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <div class="mb-2">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="edit-title">
          </div>
          <div class="mb-2">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="edit-amount">
          </div>
          <div class="mb-2">
            <label class="form-label">Category</label>
            <select class="form-select" id="edit-category">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" id="edit-date">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-edit">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
